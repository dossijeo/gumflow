name: Draft release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v6.1.1)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gumflow-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tag must match all package versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release.mjs check "$RELEASE_TAG"
        shell: bash
  build:
    needs: validate
    uses: ./.github/workflows/desktop-build.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  crazygames:
    needs: validate
    uses: ./.github/workflows/crazygames-build.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  draft:
    needs: [build, crazygames]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: gumflow-release-*
          path: release-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: dependency-locks
          path: desktop/tauri
      - name: Create or complete a DRAFT, never overwrite a public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release.mjs publish "$RELEASE_TAG"
        shell: bash
