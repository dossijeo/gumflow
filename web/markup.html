
<canvas id="game" aria-label="Gumflow, juego de plataformas de velocidad"></canvas><div id="shade"></div>
<div id="hud">
 <div class="hud-top"><div class="brand">GUM<span style="color:var(--pink)">FLOW</span></div><div class="level-meta"><div class="eyebrow"><span id="levelCounter">01 / 07</span> &nbsp; / &nbsp; MANTÉN EL IMPULSO</div><div id="levelName">Refinería de caramelo</div><div class="progress"><i id="progressFill"></i></div></div><div class="hud-buttons"><button id="sound" aria-label="Activar o desactivar sonido" title="Sonido">♪</button><button id="full" aria-label="Pantalla completa" title="Pantalla completa">⛶</button><button id="pause" aria-label="Pausar juego" title="Pausa (P / Esc)">Ⅱ</button></div></div>
 <div class="stats"><div><div class="stat-label">vidas</div><div class="lives" id="lives"></div></div><div><div class="stat-label">azúcar</div><div class="stat-number"><span class="sugar-mark"></span><span id="sugars">0</span><span style="font-size:10px;color:var(--muted)"> / 60</span></div></div><div><div class="stat-label">tiempo</div><div class="stat-number" id="clock">0:00.0</div></div><div><div class="stat-label">puntos</div><div class="stat-number" id="score">0</div></div></div>
 <div id="flowBox"><div id="flowText">FLUJO ×1</div><div class="flow-caption" id="flowCaption">ENCUENTRA TU RITMO</div><div class="flow-line"><i id="flowFill"></i></div></div>
 <div id="ability"><span id="abilityText"><span class="key-label"><kbd>SHIFT</kbd> / <kbd>X</kbd> </span> Mantén y suelta: impulso</span><div class="charge-track"><i id="chargeFill"></i></div></div>
 <div id="speedBox"><div class="speed-label">VELOCIDAD / IMPULSO</div><div id="speed"><span id="speedNum">0</span> <small>km/h*</small></div><div class="speed-line"><i id="speedFill"></i></div></div>
 <div id="chapterHUD"></div><div id="starsHUD" aria-label="Estrellas de azúcar"></div><div id="flavorHUD"></div><div id="dialogue" role="status"><div id="speaker"></div><div id="speech"></div></div><div id="tip"></div><div id="toast" role="status" aria-live="polite"></div>
</div>
<div id="touchControls"><div class="pad-left"><button class="touch-button" id="leftButton" data-action="left" aria-label="Mover a la izquierda">‹</button><button class="touch-button" id="rightButton" data-action="right" aria-label="Mover a la derecha">›</button></div><div class="pad-right"><button class="touch-button elastic" id="elasticButton" data-action="elastic" aria-label="Comprimir, mantener y soltar para impulso">↔<small>CHICLE</small></button><button class="touch-button jump" id="jumpButton" data-action="jump" aria-label="Saltar">↑<small>SALTO</small></button></div></div>
<div id="overlay"><div class="panel" id="panel"></div></div><div id="curtain"></div><div id="bootError"></div>
